[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milo-console"
version = "0.1.0"
description = "MILO_COMM console chat client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40,<3",
  "python-dotenv>=1,<2",
  "rich>=14,<15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[project.scripts]
milo = "milo_console.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/milo_console"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
