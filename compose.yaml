services:
  postgres:
    image: postgres:17-alpine
    container_name: milo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: milo
      POSTGRES_USER: milo
      POSTGRES_PASSWORD: milo
    ports:
      - "5433:5432"
    volumes:
      - milo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milo -d milo"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  milo_postgres_data:
